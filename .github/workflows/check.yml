name: Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Linux build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Evaluate all platforms and build Linux CLI
        run: |
          nix flake check --all-systems --no-build
          nix build .#cli
          ./result/bin/ray --version
          ./result/bin/ray --help
